[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mullvald-vpn-key-tools"
version = "0.9.4"
description = "Offline Mullvald VPN key generator, validator, and batch tooling."
readme = "CONTRIBUTING.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Mullvald Key Tools Maintainers" }]
keywords = ["mullvald", "vpn", "keygen", "license", "offline"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = [
    "cryptography>=42.0",
    "pydantic>=2.7",
    "click>=8.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-cryptography",
]

[project.scripts]
mullvald = "mullvald.bootstrap.cli:main"

[project.gui-scripts]
mullvald-gui = "mullvald.bootstrap.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mullvald"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=mullvald --cov-report=term-missing"